name: "I.T.S.S. Thermal SCADA"
version: "2.7.0"
slug: "itss_scada"
description: "0.3C Ondol precision heating SCADA add-on (Ingress-only Web UI) with sensor report-interval tracking, 24h chart, presets, P400 scheduler, RC fitting, boiler cost stats, and HA/Telegram alerts."
url: "https://github.com/morndew94/itss-ha"
# 빌드 이미지가 amd64 전용(amd64-base-python)이므로 amd64만 선언
arch:
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: true
# HA Ingress 전용: 외부 포트(ports)를 열지 않고 Supervisor(172.30.32.2) 경유 접속만 허용
ingress: true
ingress_port: 8099
panel_icon: "mdi:thermometer-lines"
panel_title: "I.T.S.S. SCADA"
options:
  db_path: "/data/itss_scada.db"
  update_interval_sec: 60
  zone_strategy: "hybrid"
  predictor_model: "linear_v12"
  dry_run: true
  heat_on_setpoint: 24.0
  heat_off_setpoint: 15.0
  floor_off_limit_c: 26.5
  max_run_cap_min: 15
  cooldown_min: 20
  ventilation_hold_min: 20
  history_retention_days: 30
  master_floor_entity: ""
  outdoor_temp_entity: ""
  gas_krw_per_hour: 1200
  ha_token: ""
  notify_service: ""
  telegram_chat_id: ""
  gemini_api_key: ""
  weather_location: "서울"
  log_level: "info"
  debug_trace: true
  debug_trace_days: 7
schema:
  db_path: str
  update_interval_sec: int(30,3600)
  zone_strategy: list(hybrid|simultaneous)
  predictor_model: list(linear_v12|adaptive_rc)
  dry_run: bool
  heat_on_setpoint: float(15,30)
  heat_off_setpoint: float(5,25)
  floor_off_limit_c: float(22,29)
  max_run_cap_min: int(3,15)
  cooldown_min: int(5,90)
  ventilation_hold_min: int(5,60)
  history_retention_days: int(1,365)
  master_floor_entity: str?
  outdoor_temp_entity: str?
  gas_krw_per_hour: int(100,10000)
  ha_token: password?
  notify_service: str?
  telegram_chat_id: str?
  gemini_api_key: password?
  weather_location: str?
  log_level: list(debug|info|warning|error)
  debug_trace: bool
  debug_trace_days: int(1,30)
